<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Child</title><link rel="stylesheet" href="common.css"></head><body>
<h1>Child window</h1><p id="s"></p>
<button onclick="window.close()">window.close()</button>
<script>
const has = !!window.opener;
document.getElementById('s').textContent = 'window.opener: ' + (has ? 'available (OAuth-style flows work)' : 'missing');
if (has) window.opener.postMessage('hello from child', '*');
</script></body></html>
