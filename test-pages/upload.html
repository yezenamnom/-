<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload</title><link rel="stylesheet" href="common.css"></head><body>
<h1>File upload</h1>
<p>Each input must open the system picker; nothing is uploaded anywhere (read locally only).</p>
<p>Any file: <input type="file" id="a"></p>
<p>Images, multiple: <input type="file" id="b" accept="image/*" multiple></p>
<p>Camera capture: <input type="file" id="c" accept="image/*" capture="environment"></p>
<pre id="out"></pre>
<script>
for (const id of ['a','b','c']) document.getElementById(id).addEventListener('change', e => {
  const files = [...e.target.files].map(f => f.name + ' (' + f.size + ' bytes, ' + (f.type||'?') + ')');
  document.getElementById('out').textContent += id + ': ' + (files.join(', ') || 'none') + '\n';
});
</script></body></html>
