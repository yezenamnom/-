name: mobile

on:
  push:
    paths: ["mobile/**", "docs/CONFIG_CONTRACT.md", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "docs/CONFIG_CONTRACT.md", ".github/workflows/mobile.yml"]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Lockfile must be committed and unchanged
        run: git diff --exit-code pubspec.lock
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::dart format differences"
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Debug APK (test ads, debug-signed; not for distribution)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: vela-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios:
    # Compiles the iOS app without signing. Proves the build only; it does not
    # run anything on a simulator or device.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --debug --no-codesign

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source /repo --redact --no-banner
